name: Deploy Full Website and PLI Leads

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Build the PLI Leads app
      - name: Build PLI Leads App
        working-directory: ./plileads
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      # 2. Assemble both Main Website and PLI Leads into one directory
      - name: Assemble Full Website
        run: |
          mkdir -p final_output
          
          # Copy all main website root files to final_output
          rsync -av --exclude='plileads' --exclude='.git' --exclude='.github' --exclude='final_output' ./ final_output/ || cp -r $(ls -A | grep -v -E '^(plileads|\.git|\.github|final_output)$') final_output/
          
          # Place the compiled PLI app into the /plileads subfolder
          mkdir -p final_output/plileads
          cp -r ./plileads/dist/* final_output/plileads/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # 3. Upload the combined output (Root site + /plileads/)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
