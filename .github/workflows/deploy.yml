name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - masterbranch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: |
          # 1. Automatically build schemeshare subproject
          if [ -f "schemeshare/package.json" ]; then
            echo "Building schemeshare subproject..."
            cd schemeshare && npm install && npm run build && cd ..
            mkdir -p public/schemeshare
            cp -r schemeshare/dist/* public/schemeshare/
          elif [ -f "public/schemeshare/package.json" ]; then
            echo "Building public/schemeshare subproject..."
            cd public/schemeshare && npm install && npm run build && cd ../..
            cp -r public/schemeshare/dist/* public/schemeshare/
          fi

          # 2. Automatically build plileads subproject
          if [ -f "plileads/package.json" ]; then
            echo "Building plileads subproject..."
            cd plileads && npm install && npm run build && cd ..
            mkdir -p public/plileads
            cp -r plileads/dist/* public/plileads/
          elif [ -f "public/plileads/package.json" ]; then
            echo "Building public/plileads subproject..."
            cd public/plileads && npm install && npm run build && cd ../..
            cp -r public/plileads/dist/* public/plileads/
          fi

          # 3. Automatically build tdbill subproject
          if [ -f "tdbill/package.json" ]; then
            echo "Building tdbill subproject..."
            cd tdbill && npm install && npm run build && cd ..
            mkdir -p public/tdbill
            cp -r tdbill/dist/* public/tdbill/
          elif [ -f "public/tdbill/package.json" ]; then
            echo "Building public/tdbill subproject..."
            cd public/tdbill && npm install && npm run build && cd ../..
            cp -r public/tdbill/dist/* public/tdbill/
          fi

          # 4. Build main PostalPro root website
          npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
