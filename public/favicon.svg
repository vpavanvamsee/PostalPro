<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Postal Crimson to Amber Gradient -->
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#DC2626" />
      <stop offset="50%" stopColor="#EA580C" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Glowing Amber Coin Grad -->
    <linearGradient id="logoCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>

    <!-- Upper Wing Arc Pale Cream -->
    <linearGradient id="logoWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#FCE8DC" stopOpacity="0.9" />
    </linearGradient>

    <!-- Tricolor Saffron & Green -->
    <linearGradient id="triColorSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FF9933" />
      <stop offset="100%" stopColor="#FF7700" />
    </linearGradient>

    <linearGradient id="triColorGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <!-- Shield Ambient Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#EA580C" floodOpacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Base Shield / Crest with Gold Border -->
  <path
    d="M 50 4 
       C 74 4, 92 14, 92 34 
       C 92 64, 68 88, 50 96 
       C 32 88, 8 64, 8 34 
       C 8 14, 26 4, 50 4 Z"
    fill="url(#logoEmblemGrad)"
    stroke="#FDE047"
    stroke-width="3"
    filter="url(#logoGlow)"
  />

  <!-- 2. Stylized Speed Envelope Wings (Upper Postal Crest) -->
  <path
    d="M 22 28 
       L 50 48 
       L 78 28 
       C 74 20, 62 14, 50 14 
       C 38 14, 26 20, 22 28 Z"
    fill="url(#logoWingGrad)"
  />

  <!-- Envelope Fold Inner Lines -->
  <path
    d="M 22 28 L 50 48 L 78 28"
    fill="none"
    stroke="#DC2626"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Speed Swooshes / Postal Feathers on Left & Right -->
  <path
    d="M 12 36 Q 2 48 16 62 Q 10 50 18 42 Z"
    fill="#FEF08A"
    opacity="0.9"
  />
  <path
    d="M 88 36 Q 98 48 84 62 Q 90 50 82 42 Z"
    fill="#FEF08A"
    opacity="0.9"
  />

  <!-- 4. Golden Sovereign Rupee Coin (Financial Hub Emblem) -->
  <g transform="translate(50, 62)">
    <!-- Outer Coin Ring -->
    <circle cx="0" cy="0" r="19" fill="url(#logoCoinGrad)" stroke="#FEF08A" stroke-width="2" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#78350F" stroke-width="1.2" stroke-dasharray="3 2" />

    <!-- Indian Rupee Symbol (₹) -->
    <text
      x="0"
      y="5.5"
      text-anchor="middle"
      fill="#451A03"
      font-size="16"
      font-weight="900"
      font-family="system-ui, -apple-system, sans-serif"
    >
      ₹
    </text>

    <!-- Sparkle Star on Coin -->
    <polygon
      points="12,-12 14,-7 19,-5 14,-3 12,2 10,-3 5,-5 10,-7"
      fill="#FFFFFF"
    />
  </g>

  <!-- 5. Indian Tricolor Micro Seal Ribbon at Base -->
  <g transform="translate(38, 86)">
    <rect x="0" y="0" width="8" height="3.2" rx="1" fill="url(#triColorSaffron)" />
    <rect x="8" y="0" width="8" height="3.2" rx="0.5" fill="#FFFFFF" />
    <rect x="16" y="0" width="8" height="3.2" rx="1" fill="url(#triColorGreen)" />
  </g>
</svg>
